server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/power_grid_control_center}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never

logging:
  level:
    # Parâmetros JDBC e detalhes de erros podem conter documento ou endereço.
    org.hibernate.orm.jdbc.bind: "OFF"
    org.hibernate.orm.jdbc.extract: "OFF"
    org.hibernate.orm.jdbc.error: "OFF"
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: INFO

monitoramento:
  comunicacao:
    timeout-segundos: ${COMUNICACAO_TIMEOUT_SEGUNDOS:300}
